# ebony-enriching — MCP server for the lab-notebook substrate.
#
# Edit CHANGE-ME placeholders to fit your deployment. The default volume
# (named) keeps the lab notebook under Docker's management; swap to the
# bind-mount section if you want to browse it from the host directly.

services:
  ebony-enriching:
    image: ghcr.io/parkviewlab/ebony-enriching:latest
    container_name: ebony-enriching
    restart: unless-stopped
    ports:
      - "35834:35834"
    environment:
      # Read-write for single-user dev. The scope is server-wide: a
      # read_only server lets no client write. To serve some clients
      # read-only and others read-write, run two instances with different
      # EBONY_SCOPE values (see the README's Configuration section).
      EBONY_SCOPE: "read_write"
      # Without a token the scope is capped at read_only whatever
      # EBONY_SCOPE says; set it to serve read_write.
      EBONY_INTERNAL_TOKEN: "CHANGE-ME"

    # Pick one — named volume (default) or bind mount:
    volumes:
      - ebony-data:/data
      # - /CHANGE-ME/path/to/ebony:/data    # bind mount alternative

volumes:
  ebony-data:
